<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브코딩 갤러리</title>
<link rel="preconnect" href="https://pfasdccrftfedsvwwalb.supabase.co">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f6f5fb; --card:#fff; --ink:#1d1b2b; --sub:#6b6880; --line:#e7e4f2;
    --pri:#6c4cf5; --pri2:#9b7bff; --heart:#ff3b6b; --shadow:0 4px 18px rgba(40,20,120,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  button,input,textarea{font:inherit}
  header{position:sticky;top:0;z-index:5;background:rgba(246,245,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;margin-right:auto}
  .logo span{background:linear-gradient(135deg,var(--pri),#ff6fb1);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{font-size:13px;color:var(--sub);font-weight:500}
  .search{flex:1 1 180px;max-width:280px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;outline:none}
  .search:focus{border-color:var(--pri)}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--sub);font-weight:600;font-size:14px}
  .seg button.on{background:var(--ink);color:#fff}
  .btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(108,76,245,.3)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:16px}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;position:relative}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(40,20,120,.14)}
  .cover{aspect-ratio:16/10;display:grid;place-items:center;font-size:52px;position:relative}
  .cover .new{position:absolute;top:10px;left:10px;background:#fff;color:var(--pri);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
  .title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .author{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heart{border:0;background:#fff3f6;color:var(--heart);border-radius:999px;padding:5px 11px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:4px;font-size:14px;flex-shrink:0;transition:transform .1s}
  .heart:active{transform:scale(1.2)}
  .heart .h{font-size:15px;line-height:1}
  .heart.off{background:#f3f2f7;color:#9a97ab}
  .del{position:absolute;top:8px;right:8px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;display:none}
  body.admin .del{display:block}
  .skel .cover{background:linear-gradient(90deg,#eceaf4,#f6f5fb,#eceaf4);background-size:200% 100%;animation:sh 1.2s infinite}
  .skel .title,.skel .author{height:14px;border-radius:6px;background:#eceaf4}
  .skel .author{width:50%}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;color:var(--sub);padding:60px 0;grid-column:1/-1}

  /* 모달 */
  .modal{position:fixed;inset:0;background:rgba(20,16,40,.55);display:none;z-index:20;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px}
  .sheet h2{margin:0 0 14px;font-size:20px}
  .sheet label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  .sheet input[type=text],.sheet input[type=password],.sheet textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fafafe}
  .sheet input:focus,.sheet textarea:focus{border-color:var(--pri)}
  .sheet textarea{resize:vertical;min-height:70px}
  .tabs{display:flex;gap:6px;margin-top:4px}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;cursor:pointer;font-weight:600;color:var(--sub)}
  .tabs button.on{border-color:var(--pri);color:var(--pri);background:#f3efff}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub);cursor:pointer;margin-top:8px}
  .drop.ok{border-color:var(--pri);color:var(--pri);background:#f7f4ff}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .msg{font-size:13px;color:#d33;margin-top:8px;min-height:18px}
  .hint{font-size:12px;color:var(--sub)}

  /* 작품 보기 */
  .viewer{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column}
  .viewer.show{display:flex}
  .vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .vbar .info{margin-right:auto;min-width:0}
  .vbar .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbar .info small{color:var(--sub)}
  .vdesc{background:#faf9ff;padding:8px 14px;font-size:14px;color:#4a4760;border-bottom:1px solid var(--line);display:none}
  .viewer iframe{flex:1;border:0;width:100%;background:#fff}
  .loading{position:absolute;inset:60px 0 0;display:grid;place-items:center;color:#fff;font-weight:600;pointer-events:none}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:600px){
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .cover{font-size:40px}
    .title{font-size:15px}
    .search{max-width:none;order:5;flex-basis:100%}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">✨ <span>바이브코딩 갤러리</span> <small class="count" id="count"></small></div>
    <input class="search" id="q" type="text" placeholder="작품 이름·만든 사람 검색">
    <div class="seg" id="sort">
      <button data-s="new" class="on">최신순</button>
      <button data-s="like">인기순</button>
    </div>
    <button class="icon-btn" id="refresh" title="새로고침">↻</button>
    <button class="icon-btn" id="adminBtn" title="선생님 모드">🔒</button>
    <button class="btn" id="upBtn">＋ 작품 올리기</button>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<!-- 업로드 -->
<div class="modal" id="upModal">
  <div class="sheet">
    <h2>🚀 내 작품 올리기</h2>
    <label>작품 이름 *</label>
    <input type="text" id="fTitle" maxlength="60" placeholder="예) 우주 피하기 게임">
    <label>만든 사람 *</label>
    <input type="text" id="fAuthor" maxlength="30" placeholder="예) 3학년 2반 김민준">
    <label>한 줄 설명 <span class="hint">(선택)</span></label>
    <textarea id="fDesc" maxlength="300" placeholder="어떤 프로그램인지, 무엇을 의도했는지 적어 주세요"></textarea>
    <label>HTML 작품 *</label>
    <div class="tabs">
      <button class="on" data-m="file">📁 파일 올리기</button>
      <button data-m="paste">📋 코드 붙여넣기</button>
    </div>
    <div id="mFile">
      <div class="drop" id="drop">여기를 눌러 .html 파일 선택<br><span class="hint">또는 파일을 끌어다 놓기</span></div>
      <input type="file" id="fFile" accept=".html,.htm,text/html" hidden>
    </div>
    <div id="mPaste" style="display:none">
      <textarea id="fCode" style="min-height:160px;font-family:monospace;font-size:12px" placeholder="제미나이가 만들어 준 HTML 코드를 통째로 붙여넣으세요"></textarea>
    </div>
    <div class="msg" id="upMsg"></div>
    <div class="actions">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn" id="upSend">올리기</button>
    </div>
  </div>
</div>

<!-- 선생님 모드 -->
<div class="modal" id="adModal">
  <div class="sheet">
    <h2>🔒 선생님 모드</h2>
    <p class="hint">켜면 카드마다 삭제 버튼이 보여요.</p>
    <label>비밀번호</label>
    <input type="password" id="adPw">
    <details style="margin-top:12px"><summary class="hint">비밀번호 바꾸기</summary>
      <label>새 비밀번호 (4자 이상)</label>
      <input type="password" id="adNew">
      <button class="btn ghost" id="adChange" style="margin-top:8px">변경</button>
    </details>
    <div class="msg" id="adMsg"></div>
    <div class="actions">
      <button class="btn ghost" data-close>닫기</button>
      <button class="btn" id="adOn">켜기</button>
    </div>
  </div>
</div>

<!-- 작품 보기 -->
<div class="viewer" id="viewer">
  <div class="vbar">
    <button class="icon-btn" id="vClose" title="닫기">←</button>
    <div class="info"><b id="vTitle"></b><small id="vAuthor"></small></div>
    <button class="heart" id="vHeart"></button>
    <button class="icon-btn" id="vFull" title="전체 화면">⛶</button>
  </div>
  <div class="vdesc" id="vDesc"></div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock" allow="fullscreen; autoplay"></iframe>
  <div class="loading" id="vLoading">불러오는 중…</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://pfasdccrftfedsvwwalb.supabase.co";
const SB_KEY = "sb_publishable_XuCCXqn_RAYYbEG9Ua33XA_-opIYotq";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });

const MAX_SIZE = 3000000;          // 약 3MB
const CACHE_KEY = "vg_list_v1";
const LIKE_KEY = "vg_likes_v1";
const $ = s => document.querySelector(s);

let works = [], sortBy = "new", query = "", adminPw = null, current = null;
const htmlCache = new Map();

// ---------- 저장소(브라우저) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let liked = new Set(store.get(LIKE_KEY, []));

// ---------- 표지 꾸미기 ----------
const EMOJI = ["🎮","🚀","🎨","🧩","🌈","🐱","⚡","🎵","🌟","🔮","🦄","🍀","🎯","🛸","🐳","🍩","📚","🧪","🌊","🔥"];
const GRAD = [["#a18cff","#6c4cf5"],["#ff9a9e","#fad0c4"],["#84fab0","#8fd3f4"],["#fccb90","#d57eeb"],
  ["#a1c4fd","#c2e9fb"],["#f6d365","#fda085"],["#43e97b","#38f9d7"],["#fa709a","#fee140"],
  ["#30cfd0","#5b4bd1"],["#ffecd2","#fcb69f"]];
function hash(s){ let h=0; for(const c of s) h=(h*31 + c.charCodeAt(0))|0; return Math.abs(h); }
function pickEmoji(w){
  const t = w.title;
  const map = [["게임","🎮"],["퀴즈","❓"],["계산","🧮"],["그림","🎨"],["음악","🎵"],["피아노","🎹"],["타자","⌨️"],
    ["우주","🚀"],["날씨","☀️"],["시계","⏰"],["타이머","⏱️"],["고양이","🐱"],["강아지","🐶"],["뱀","🐍"],["축구","⚽"],
    ["농구","🏀"],["요리","🍳"],["단어","📚"],["영어","🔤"],["수학","➗"],["과학","🧪"],["지도","🗺️"],["운세","🔮"],["점","🔮"]];
  for(const [k,e] of map) if(t.includes(k)) return e;
  return EMOJI[hash(t + w.id) % EMOJI.length];
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------- 목록 ----------
function skeleton(){
  $("#grid").innerHTML = Array.from({length:8}).map(()=>`<div class="card skel"><div class="cover"></div><div class="body"><div class="title"></div><div class="author"></div></div></div>`).join("");
}
function render(){
  let list = works.filter(w => !query || (w.title + " " + w.author).toLowerCase().includes(query));
  list.sort(sortBy === "like"
    ? (a,b) => b.likes - a.likes || b.id - a.id
    : (a,b) => b.id - a.id);
  $("#count").textContent = works.length ? `· ${works.length}개` : "";
  if(!list.length){
    $("#grid").innerHTML = `<div class="empty">${works.length ? "검색 결과가 없어요" : "아직 올라온 작품이 없어요.<br>첫 작품을 올려 보세요! 🚀"}</div>`;
    return;
  }
  const dayAgo = Date.now() - 864e5;
  $("#grid").innerHTML = list.map(w => {
    const g = GRAD[hash(w.author + w.id) % GRAD.length];
    const on = liked.has(w.id);
    const isNew = new Date(w.created_at).getTime() > dayAgo;
    return `<div class="card" data-id="${w.id}">
      <div class="cover" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${isNew ? '<span class="new">NEW</span>' : ""}${pickEmoji(w)}</div>
      <button class="del" data-del="${w.id}">삭제</button>
      <div class="body">
        <div class="title" title="${esc(w.title)}">${esc(w.title)}</div>
        <div class="row">
          <div class="author">${esc(w.author)}</div>
          <button class="heart ${on ? "" : "off"}" data-like="${w.id}"><span class="h">${on ? "♥" : "♡"}</span>${w.likes}</button>
        </div>
      </div>
    </div>`;
  }).join("");
}
async function load(){
  const { data, error } = await sb.from("gallery_works")
    .select("id,title,author,description,likes,created_at")   // html은 빼고 가볍게
    .order("id", { ascending:false }).limit(500);
  if(error){ toast("불러오기 실패: 인터넷 연결을 확인해 주세요"); return; }
  works = data;
  store.set(CACHE_KEY, works);
  render();
}

// ---------- 좋아요 ----------
async function toggleLike(id){
  const w = works.find(x => x.id === id); if(!w) return;
  const on = liked.has(id), delta = on ? -1 : 1;
  on ? liked.delete(id) : liked.add(id);
  w.likes = Math.max(0, w.likes + delta);
  store.set(LIKE_KEY, [...liked]);
  render(); if(current && current.id === id) paintViewerHeart();
  const { data, error } = await sb.rpc("gallery_like", { p_id:id, p_delta:delta });
  if(!error && typeof data === "number"){ w.likes = data; render(); if(current && current.id === id) paintViewerHeart(); store.set(CACHE_KEY, works); }
}

// ---------- 작품 보기 ----------
async function openWork(id){
  const w = works.find(x => x.id === id); if(!w) return;
  current = w;
  $("#vTitle").textContent = w.title;
  $("#vAuthor").textContent = w.author;
  $("#vDesc").textContent = w.description || "";
  $("#vDesc").style.display = w.description ? "block" : "none";
  paintViewerHeart();
  $("#frame").srcdoc = "";
  $("#vLoading").style.display = "grid";
  $("#viewer").classList.add("show");
  document.body.style.overflow = "hidden";
  history.pushState({ view:id }, "", "#" + id);
  let html = htmlCache.get(id);
  if(!html){
    const { data, error } = await sb.from("gallery_works").select("html").eq("id", id).single();
    if(error){ $("#vLoading").textContent = "작품을 불러오지 못했어요"; return; }
    html = data.html; htmlCache.set(id, html);
  }
  if(current !== w) return;
  $("#frame").srcdoc = html;
  $("#vLoading").style.display = "none";
}
function closeViewer(fromPop){
  $("#viewer").classList.remove("show");
  $("#frame").srcdoc = "";
  document.body.style.overflow = "";
  current = null;
  if(!fromPop && location.hash) history.back();
}
function paintViewerHeart(){
  const on = liked.has(current.id);
  $("#vHeart").className = "heart" + (on ? "" : " off");
  $("#vHeart").innerHTML = `<span class="h">${on ? "♥" : "♡"}</span>${current.likes}`;
}
window.addEventListener("popstate", () => { if($("#viewer").classList.contains("show")) closeViewer(true); });

// ---------- 업로드 ----------
let mode = "file", fileHtml = "";
function openModal(id){ $(id).classList.add("show"); }
function closeModals(){ document.querySelectorAll(".modal").forEach(m => m.classList.remove("show")); }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModals);
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if(e.target === m) closeModals(); }));

$("#upBtn").onclick = () => {
  $("#upMsg").textContent = "";
  try{ $("#fAuthor").value = localStorage.getItem("vg_author") || ""; }catch(e){}
  openModal("#upModal");
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#mFile").style.display = mode === "file" ? "" : "none";
  $("#mPaste").style.display = mode === "paste" ? "" : "none";
});
function readFile(f){
  if(!f) return;
  if(!/\.html?$/i.test(f.name)){ $("#upMsg").textContent = ".html 파일만 올릴 수 있어요"; return; }
  if(f.size > MAX_SIZE){ $("#upMsg").textContent = "파일이 너무 커요 (3MB 이하)"; return; }
  const r = new FileReader();
  r.onload = () => {
    fileHtml = r.result;
    $("#drop").classList.add("ok");
    $("#drop").innerHTML = `✅ ${esc(f.name)}<br><span class="hint">다른 파일로 바꾸려면 다시 누르기</span>`;
    if(!$("#fTitle").value.trim()){
      const t = (fileHtml.match(/<title>([^<]*)<\/title>/i) || [])[1];
      $("#fTitle").value = (t || f.name.replace(/\.html?$/i, "")).trim().slice(0, 60);
    }
    $("#upMsg").textContent = "";
  };
  r.readAsText(f, "utf-8");
}
$("#drop").onclick = () => $("#fFile").click();
$("#fFile").onchange = e => readFile(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("ok"); }));
$("#drop").addEventListener("drop", e => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });

$("#upSend").onclick = async () => {
  const title = $("#fTitle").value.trim(), author = $("#fAuthor").value.trim(), description = $("#fDesc").value.trim();
  const html = mode === "file" ? fileHtml : $("#fCode").value.trim();
  if(!title || !author){ $("#upMsg").textContent = "작품 이름과 만든 사람을 적어 주세요"; return; }
  if(html.length < 20){ $("#upMsg").textContent = mode === "file" ? "HTML 파일을 선택해 주세요" : "코드를 붙여넣어 주세요"; return; }
  if(html.length > MAX_SIZE){ $("#upMsg").textContent = "작품이 너무 커요 (3MB 이하)"; return; }
  $("#upSend").disabled = true; $("#upSend").textContent = "올리는 중…";
  const { data, error } = await sb.from("gallery_works")
    .insert({ title, author, description: description || null, html })
    .select("id,title,author,description,likes,created_at").single();
  $("#upSend").disabled = false; $("#upSend").textContent = "올리기";
  if(error){ $("#upMsg").textContent = "올리기 실패: " + error.message; return; }
  try{ localStorage.setItem("vg_author", author); }catch(e){}
  works.unshift(data); htmlCache.set(data.id, html); store.set(CACHE_KEY, works);
  sortBy = "new"; document.querySelectorAll("#sort button").forEach(b => b.classList.toggle("on", b.dataset.s === "new"));
  render(); closeModals();
  $("#fTitle").value = ""; $("#fDesc").value = ""; $("#fCode").value = ""; fileHtml = ""; $("#fFile").value = "";
  $("#drop").classList.remove("ok"); $("#drop").innerHTML = `여기를 눌러 .html 파일 선택<br><span class="hint">또는 파일을 끌어다 놓기</span>`;
  toast("🎉 작품이 올라갔어요!");
};

// ---------- 선생님 모드 ----------
$("#adminBtn").onclick = () => {
  if(adminPw){ adminPw = null; document.body.classList.remove("admin"); $("#adminBtn").textContent = "🔒"; toast("선생님 모드를 껐어요"); return; }
  $("#adMsg").textContent = ""; $("#adPw").value = ""; openModal("#adModal");
};
$("#adOn").onclick = async () => {
  const pw = $("#adPw").value;
  const { data } = await sb.rpc("gallery_check_pw", { p_pw: pw });
  if(!data){ $("#adMsg").textContent = "비밀번호가 맞지 않아요"; return; }
  adminPw = pw; document.body.classList.add("admin"); $("#adminBtn").textContent = "🔓";
  closeModals(); toast("선생님 모드 ON — 카드에서 삭제할 수 있어요");
};
$("#adChange").onclick = async () => {
  const { data } = await sb.rpc("gallery_change_pw", { p_old: $("#adPw").value, p_new: $("#adNew").value });
  $("#adMsg").textContent = data ? "✅ 비밀번호를 바꿨어요" : "현재 비밀번호가 틀렸거나 새 비밀번호가 너무 짧아요";
};

// ---------- 이벤트 ----------
$("#grid").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if(del){
    e.stopPropagation();
    const id = +del.dataset.del, w = works.find(x => x.id === id);
    if(!confirm(`"${w.title}" (${w.author}) 작품을 삭제할까요?`)) return;
    const { data } = await sb.rpc("gallery_delete", { p_id:id, p_pw:adminPw });
    if(!data){ toast("삭제 실패 (비밀번호 확인)"); return; }
    works = works.filter(x => x.id !== id); store.set(CACHE_KEY, works); render(); toast("삭제했어요");
    return;
  }
  const like = e.target.closest("[data-like]");
  if(like){ e.stopPropagation(); toggleLike(+like.dataset.like); return; }
  const card = e.target.closest(".card[data-id]");
  if(card) openWork(+card.dataset.id);
});
$("#vHeart").onclick = () => current && toggleLike(current.id);
$("#vClose").onclick = () => closeViewer(false);
$("#vFull").onclick = () => { const f = $("#frame"); (f.requestFullscreen || f.webkitRequestFullscreen)?.call(f); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if($("#viewer").classList.contains("show")) closeViewer(false); else closeModals(); } });
document.querySelectorAll("#sort button").forEach(b => b.onclick = () => {
  sortBy = b.dataset.s; document.querySelectorAll("#sort button").forEach(x => x.classList.toggle("on", x === b)); render();
});
let qt; $("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 150); };
$("#refresh").onclick = async () => { await load(); toast("새로 불러왔어요"); };
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }

// ---------- 시작: 저장된 목록을 먼저 보여 주고, 뒤에서 최신으로 갱신 ----------
works = store.get(CACHE_KEY, []);
works.length ? render() : skeleton();
load().then(() => { const id = +location.hash.slice(1); if(id && works.some(w => w.id === id)) openWork(id); });
</script>
</body>
</html>
